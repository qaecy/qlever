[package]
name = "qlever-embedded"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
description = "QLever held open in a Rust process, through libqlever_c (src/libqlever/c/qlever.h)"
publish = false

[dependencies]
libloading = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

# Unsafe code is denied rather than forbidden: `ffi.rs`, and only it, crosses into C.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
